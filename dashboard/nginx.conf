server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Proxy WebSocket → bridge (mismo origen para el navegador, sin CORS)
    location /ws {
        proxy_pass         http://bridge:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;
    }

    # Cache agresivo para assets con hash (Vite los genera con hash en el nombre)
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Todas las rutas caen en index.html (necesario para react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
